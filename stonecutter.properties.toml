loomx.loom_version = "1.18-SNAPSHOT"

[mod]
id = "numismatic_coins"
name = "Numismatic Coins"
group = "com.joelcranston"
version = "0.1.0"
channel_tag = "-alpha.1"
description = "Terraria-style currency in Minecraft, a rewrite of Numismatic Overhaul"
authors = ["JoelCranston"]
contributors = ["glisco", "Pois1x", "Noaaan"]
inception_year = "2026"
license.name = "MIT"
license.url = "https://opensource.org/licenses/MIT"
license.dist = "repo"
environment = "client_and_server"
sources_url = "https://github.com/JoelCranston/Numismatic_Coins"
homepage_url = "https://github.com/JoelCranston/Numismatic_Coins"
issues_url = "https://github.com/JoelCranston/Numismatic_Coins/issues"
discord_url = ""
dev_jvm_args = [
	"-XX:+IgnoreUnrecognizedVMOptions",
	"-XX:+UseZGC",
	"-XX:+HeapDumpOnOutOfMemoryError",
	"-XX:HeapDumpPath=heapdump.hprof",
	"-XX:+ShowCodeDetailsInExceptionMessages",
	"-XX:+UseCompactObjectHeaders",
	"-XX:+AlwaysPreTouch",
	"-XX:+UseStringDeduplication",
	"-Dfile.encoding=UTF-8"
]
dev_jvm_args_mixin_debug = [
	"-Dmixin.env.remapRefMap=true",
	"-Dmixin.debug.verbose=true",
	"-Dmixin.debug.verify=true",
	"-Dmixin.debug.countInjections=true",
	"-Dmixin.debug=true",
	"-Dmixin.debug.export=true"
]

[[mod.pom.developers]]
id = "joelcranston"
name = "JoelCranston"
url = "https://github.com/JoelCranston"

[fabric]
deps.fabric-loader = "0.19.2"

[fabric."26.1.2"]
deps.minecraft = "26.1.2"
deps.fabric-api = "0.146.1+26.1.2"
deps.modmenu = "18.0.0-alpha.8"
publish.additionalVersions = ["26.1.1", "26.1"]

[fabric."26.2"]
deps.minecraft = "26.2"
deps.fabric-api = "0.161.0+26.2"
deps.modmenu = "20.0.2"

[neoforge]

[neoforge."26.1.2"]
deps.minecraft = "26.1.2"
deps.neoforge = "26.1.2.109"
publish.additionalVersions = ["26.1.1", "26.1"]
