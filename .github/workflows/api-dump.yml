name: api-dump
# Dumps the vanilla, Fabric API and NeoForge API shapes the implementation plan relies on (M0).
# The dump is uploaded as an artifact and pushed as a single commit to refs/api-dump/latest (not a
# branch), so a session that cannot reach the mavens can `git fetch origin refs/api-dump/latest`.
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/api-dump/**'
      - '.github/workflows/api-dump.yml'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Resolve dependencies
        run: ./gradlew buildAndCollect --no-daemon --console=plain

      - name: Dump APIs
        run: python3 scripts/api-dump/dump.py

      - name: Upload dump
        uses: actions/upload-artifact@v4
        with:
          name: api-dump
          path: api-dump/

      - name: Push dump to refs/api-dump/latest
        run: |
          cd api-dump
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "API dump from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/api-dump/latest
